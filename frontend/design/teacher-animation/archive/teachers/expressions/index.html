<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>教师表情预览</title>
    <style>
      :root {
        font-family: FangSong, 仿宋, STFangsong, serif;
        color: #776452;
        background: #faf7f1;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
      main { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      .character { min-width: 0; padding: 24px 16px 20px; border: 1px solid #e9e0d2; border-radius: 28px; background: #fffcf7; }
      .picture { display: block; width: 100%; max-width: 320px; height: auto; aspect-ratio: 1; object-fit: contain; margin: 0 auto; }
      .controls { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
      .states { display: flex; gap: 6px; padding-right: 10px; border-right: 1px solid #e9e0d2; }
      button { display: grid; place-items: center; width: 42px; height: 42px; padding: 9px; color: inherit; border: 1px solid transparent; border-radius: 50%; background: transparent; cursor: pointer; }
      button:hover { background: #f3ecdf; }
      button[aria-pressed="true"] { background: #eee3d0; border-color: #dfcdb2; color: #604d39; }
      button:focus-visible { outline: 3px solid #92b1cf; outline-offset: 3px; }
      .play { margin-left: 2px; border-color: #e3d8c6; background: #f8f1e4; }
      .play[data-playing="true"] { background: #e7eef5; border-color: #bccfdf; }
      button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .play svg { fill: currentColor; stroke-width: 0; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @media (max-width: 650px) {
        body { padding: 20px 14px; }
        main { max-width: 400px; grid-template-columns: 1fr; gap: 20px; }
        .character { padding: 18px 14px; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <symbol id="thinking" viewBox="0 0 24 24">
          <path d="M20 9.2c0 4-3.6 6.6-8 6.6a11 11 0 0 1-3-.4l-4.5 2.1.9-4A6.1 6.1 0 0 1 4 9.2C4 5.3 7.6 3 12 3s8 2.3 8 6.2Z" />
          <path d="M8 9.5h.1m3.9 0h.1m3.9 0h.1" stroke-width="2.6" />
          <circle cx="5" cy="21" r=".8" />
        </symbol>
        <symbol id="idea" viewBox="0 0 24 24">
          <path d="M8.5 15.5C8.5 13.4 6 12.7 6 9a6 6 0 0 1 12 0c0 3.7-2.5 4.4-2.5 6.5m-7 1h7m-6 3h5m-4 2h3M12 1v-1M3.5 3.5l-1-1m18 1 1-1M2 9H.5M23.5 9H22" />
        </symbol>
        <symbol id="explaining" viewBox="0 0 24 24">
          <path d="M4 3.5h16a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-7L7 21v-4.5H4A1.5 1.5 0 0 1 2.5 15V5A1.5 1.5 0 0 1 4 3.5ZM7 8h10M7 12h6" />
        </symbol>
        <symbol id="done" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M7 10c.6-1.3 2.4-1.3 3 0m4 0c.6-1.3 2.4-1.3 3 0M8 14.5c1.8 3.2 6.2 3.2 8 0" />
        </symbol>
        <symbol id="play" viewBox="0 0 24 24"><path d="M7 4.8c0-.8.9-1.2 1.5-.8l11 7.2c.6.4.6 1.2 0 1.6L8.5 20c-.6.4-1.5 0-1.5-.8Z" /></symbol>
      </defs>
    </svg>
    <main aria-label="教师表情预览">
      <section class="character" data-character="penguin" data-name="小企鹅" aria-label="小企鹅表情">
        <img class="picture" src="penguin-thinking.png" alt="小企鹅：思考中" width="320" height="320" />
        <div class="controls">
          <div class="states" role="group" aria-label="选择小企鹅表情">
            <button type="button" data-state="thinking" aria-label="思考中" aria-pressed="true"><svg aria-hidden="true"><use href="#thinking" /></svg></button>
            <button type="button" data-state="idea" aria-label="有思路" aria-pressed="false"><svg aria-hidden="true"><use href="#idea" /></svg></button>
            <button type="button" data-state="explaining" aria-label="讲解中" aria-pressed="false"><svg aria-hidden="true"><use href="#explaining" /></svg></button>
            <button type="button" data-state="done" aria-label="完成啦" aria-pressed="false"><svg aria-hidden="true"><use href="#done" /></svg></button>
          </div>
          <button type="button" class="play" aria-label="播放一遍小企鹅表情变化"><svg aria-hidden="true"><use href="#play" /></svg></button>
        </div>
        <p class="visually-hidden" aria-live="polite"></p>
      </section>
      <section class="character" data-character="ghost" data-name="小幽灵" aria-label="小幽灵表情">
        <img class="picture" src="ghost-thinking.png" alt="小幽灵：思考中" width="320" height="320" />
        <div class="controls">
          <div class="states" role="group" aria-label="选择小幽灵表情">
            <button type="button" data-state="thinking" aria-label="思考中" aria-pressed="true"><svg aria-hidden="true"><use href="#thinking" /></svg></button>
            <button type="button" data-state="idea" aria-label="有思路" aria-pressed="false"><svg aria-hidden="true"><use href="#idea" /></svg></button>
            <button type="button" data-state="explaining" aria-label="讲解中" aria-pressed="false"><svg aria-hidden="true"><use href="#explaining" /></svg></button>
            <button type="button" data-state="done" aria-label="完成啦" aria-pressed="false"><svg aria-hidden="true"><use href="#done" /></svg></button>
          </div>
          <button type="button" class="play" aria-label="播放一遍小幽灵表情变化"><svg aria-hidden="true"><use href="#play" /></svg></button>
        </div>
        <p class="visually-hidden" aria-live="polite"></p>
      </section>
    </main>
    <script>
      const states = ['thinking', 'idea', 'explaining', 'done'];
      const labels = ['思考中', '有思路', '讲解中', '完成啦'];
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      document.querySelectorAll('[data-character]').forEach((card) => {
        const character = card.dataset.character;
        const name = card.dataset.name;
        const picture = card.querySelector('.picture');
        const stateButtons = [...card.querySelectorAll('[data-state]')];
        const playButton = card.querySelector('.play');
        const status = card.querySelector('[aria-live]');
        let timers = [];
        let revision = 0;
        let currentIndex = 0;

        function stop() {
          timers.forEach(window.clearTimeout);
          timers = [];
          playButton.dataset.playing = 'false';
        }

        function show(index, animateThinking = false) {
          currentIndex = index;
          picture.src = index === 0 && animateThinking && !motionPreference.matches
            ? `${character}-thinking.gif?replay=${Date.now()}-${++revision}`
            : `${character}-${states[index]}.png`;
          picture.alt = `${name}：${labels[index]}`;
          stateButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
          status.textContent = labels[index];
        }

        stateButtons.forEach((button, index) => {
          button.addEventListener('click', () => {
            stop();
            show(index, true);
          });
        });

        playButton.addEventListener('click', () => {
          stop();
          show(0, true);
          playButton.dataset.playing = 'true';
          for (let i = 1; i < states.length; i++) {
            timers.push(window.setTimeout(() => show(i), i * 2000));
          }
          timers.push(window.setTimeout(() => {
            stop();
            status.textContent = '已停止';
          }, 8000));
        });
        motionPreference.addEventListener('change', (event) => {
          if (event.matches && currentIndex === 0) picture.src = `${character}-thinking.png`;
        });
      });
    </script>
  </body>
</html>
