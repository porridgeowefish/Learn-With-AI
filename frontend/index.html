<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Security-Policy" content="frame-src blob:; object-src 'none'">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,500;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <title>Learn-With-AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const key = 'lll.ui.theme';
        const allowed = ['lychee-paper', 'mountain-mist', 'wisteria-gray', 'codex-white', 'claude-paper'];
        const stored = localStorage.getItem(key);
        const preference = allowed.includes(stored) ? stored : 'lychee-paper';
        document.documentElement.dataset.theme = preference;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
