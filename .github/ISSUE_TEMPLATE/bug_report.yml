name: Bug report
description: Report a reproducible problem in Learn-With-AI
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Click…\n3. See…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, browser, Agent CLI, commit/version
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove API keys, private prompts, and learning data first.
